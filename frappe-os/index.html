<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frappe OS</title>
  <!-- Desktop PWA: makes /os installable in its own standalone window. The service
       worker is registered from main.ts (production only). -->
  <link rel="manifest" href="/os/manifest.json" />
  <link rel="icon" href="/assets/frappe/images/os-icon-192.png" />
  <!-- Title-bar/chrome color follows the system light/dark theme. Used by the browser for any
       drawn chrome (the standalone fallback bar when window-controls-overlay isn't active, e.g.
       fullscreen or unsupported browsers). With WCO active the app draws the strip itself. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #app { height: 100vh; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-thumb { background: var(--outline-gray-2); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
    *::-webkit-scrollbar-track { background: transparent; }
    @keyframes osWinIn { from { opacity: 0; transform: scale(0.97) translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes osFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes osPop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
  </style>
  <!-- The ADR-0009 shared-singleton import map is injected by the osImportMap() Vite plugin
       (mode-aware: dev → broker source modules, build → stable broker chunks). -->
</head>
<body>
  <div id="app"></div>
  <script type="text/javascript">
    // Stays literal `{{ csrf_token }}` in pure Vite dev (no jinja); replaced when
    // served through www/os.py. boot.js / api.js treat an unrendered token as empty.
    window.csrf_token = '{{ csrf_token }}'
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
